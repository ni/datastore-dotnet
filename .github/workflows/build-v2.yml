name: Build V2

on:
  push:
    branches: [main, releases/**]
  pull_request:
    branches: [main, releases/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-v2:
    name: Build V2 on Windows
    runs-on: windows-latest
    env:
      NuGetPackageSourceCredentials_niartifacts-nuget-packages: >-
        Username=token;Password=${{ secrets.ARTIFACTORY_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build V2 examples
        run: dotnet build examples/v2/V2.Examples.slnx

      - name: Check formatting (V2 examples)
        if: always()
        run: dotnet format examples/v2/V2.Examples.slnx --verify-no-changes
