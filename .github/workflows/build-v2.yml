name: Build V2

on:
  push:
    branches: [main, releases/**]
  pull_request:
    branches: [main, releases/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-v2:
    name: Build V2 on Windows
    runs-on: windows-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: ni/dotnet-actions/setup-dotnet@497c653b06046fc80197afcbb5013c625246d280
        with:
          workspace-root: examples/v2
          artifactory-url: https://pull.artifacts.ni.com/artifactory/api/nuget/v3/rnd-nuget-pre
          jfrog-access-token: ${{ secrets.JFROG_ACCESS_TOKEN }}
          jfrog-username: ${{ vars.JFROG_USERNAME }}
          dotnet-version: '10.0.x'

      - name: Restore V2 examples
        run: dotnet restore examples/v2/V2.Examples.slnx --configfile examples/v2/nuget.config

      - name: Build V2 examples
        run: dotnet build examples/v2/V2.Examples.slnx --no-restore

      - name: Check formatting (V2 examples)
        if: always()
        run: dotnet format examples/v2/V2.Examples.slnx --verify-no-changes --no-restore
